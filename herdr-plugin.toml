id = "isseii10.herdr-pickers"
name = "herdr-pickers"
version = "0.2.0"
min_herdr_version = "0.9.5"
platforms = ["macos", "linux"]
description = "fzf pickers in a popup: switch/create workspaces from zoxide dirs, and jump to a running agent with a live output preview."

# Keys are bound in the user's config.toml with type = "plugin_action".
# Each action opens the matching popup pane below; sizes can be overridden
# in $HERDR_PLUGIN_CONFIG_DIR/config.env (see config.env.example).

[[actions]]
id = "workspace"
title = "pickers: switch / create workspace (zoxide)"
contexts = ["global"]
command = ["bash", "bin/open-picker", "workspace"]

[[actions]]
id = "agent"
title = "pickers: jump to agent"
contexts = ["global"]
command = ["bash", "bin/open-picker", "agent"]

# Popup titles are drawn on the border as-is, and herdr trims whitespace from
# them. U+2800 (braille blank) is not whitespace, so it survives the trim and
# shows as a space between the border and the title. Drop it if herdr pads
# popup titles itself: https://github.com/herdrdev/herdr/discussions/6195
[[panes]]
id = "workspace-picker"
title = "\u2800workspace\u2800"
placement = "popup"
width = "60%"
height = "60%"
command = ["bash", "bin/workspace-picker"]

[[panes]]
id = "agent-picker"
title = "\u2800agent\u2800"
placement = "popup"
width = "80%"
height = "80%"
command = ["bash", "bin/agent-picker"]

# Records every pane focus (it also fires on workspace switches) so the
# pickers can list the most recently used workspaces and agents first.
[[events]]
on = "pane.focused"
command = ["bash", "hooks/record-focus"]
