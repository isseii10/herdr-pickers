name: ci

on:
  push:
  pull_request:

# Read-only token: the checks never write to the repository.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit so a moved tag can't change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: bash -n
        run: for f in bin/* lib/* demo/herdr demo/bin/* demo/shell demo/session-setup demo/screenshots; do bash -n "$f"; done

      - name: shellcheck
        run: shellcheck -x bin/* lib/* demo/herdr demo/bin/* demo/shell demo/session-setup demo/screenshots

      # Every push to main is what herdr.dev/plugins serves, so the manifest must
      # parse and point at files that exist.
      - name: manifest
        shell: python
        run: |
          import os, sys, tomllib

          with open("herdr-plugin.toml", "rb") as f:
              m = tomllib.load(f)

          errors = [f"missing top-level `{k}`" for k in ("id", "name", "version", "min_herdr_version") if not m.get(k)]
          panes = {p["id"] for p in m.get("panes", [])}
          for kind in ("actions", "panes"):
              for e in m.get(kind, []):
                  if not str(e.get("title", "")).strip("⠀ "):
                      errors.append(f"{kind} `{e.get('id')}`: empty title")
                  if kind == "actions" and "." in e["id"]:
                      errors.append(f"action `{e['id']}`: ids cannot contain dots")
                  script = e["command"][1] if e["command"][0] in ("bash", "sh") else e["command"][0]
                  if not os.path.isfile(script):
                      errors.append(f"{kind} `{e['id']}`: {script} does not exist")

          # bin/open-picker opens these entrypoints by name.
          for entry in ("workspace-picker", "agent-picker"):
              if entry not in panes:
                  errors.append(f"pane `{entry}` is missing (used by bin/open-picker)")

          for e in errors:
              print(f"::error file=herdr-plugin.toml::{e}")
          sys.exit(1 if errors else 0)
